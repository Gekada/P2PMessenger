syntax = "proto3";

package proto;

enum MessageType {
  PING = 0;
  STORE = 1;
  FIND_NODE = 2;
  FIND_VALUE = 3;
}

message NodeInfo {
  string ip = 1;
  int32 port = 2;
  string node_id = 3;
}

message DataInfo {
  bytes key = 1;
  bytes value = 3;
}

message DelayedChatMessage {
  string message_uuid = 1;
  int64 timestamp = 3;
  string encrypted_text = 4;
}

message Message {
  MessageType type = 1;
  bytes from_user = 2;
  bytes to_user = 3;
  bytes rpc_id = 4;
  int64 timestamp = 5;
  bool is_reply = 6;
  optional bytes payload = 7;
  repeated NodeInfo closest_nodes = 8;
  repeated DataInfo data = 9;
}

